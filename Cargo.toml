[package]
name = "qwe"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    # instead of default ["2d", "3d", "ui", "audio"]: no 3d stack, no audio
    "2d",
    "ui",
    "dynamic_linking",
    "bevy_dev_tools",
    "bevy_remote",
    "bevy_camera_controller",
    "pan_camera",
    "default_font",
    # выбранные в UI опции переживают перезапуск (src/prefs.rs)
    "bevy_settings",
] }
bevy_northstar = "0.7"
earcutr = "0.5"
i_overlay = "7"
# симплекс-шум под поле хвойных массивов (src/map/trees/conifer.rs)
noise = "0.9"
pathfinding = "4"
# полигональный navmesh: CDT + инфляция препятствий радиусом агента (navigation/polymesh.rs)
polyanya = "0.16"
# polyanya говорит на glam 0.30 (bevy 0.19 несёт 0.32) — отдельный инстанс
# только чтобы конструировать её Vec2 на входе триангуляции
polyanya_glam = { package = "glam", version = "0.30" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

# вендоренная копия polyanya 0.16.1: воронка теряла существующий путь на
# сшитых по швам слоях-чанках (см. navigation/polymesh.rs), а чинить и
# диагностировать это можно только внутри крейта. Отличия от crates.io
# помечены комментарием `QWE:` в исходниках
[patch.crates-io]
polyanya = { path = "vendor/polyanya" }

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[lints.clippy]
type_complexity = "allow"
wildcard_imports = "warn"
