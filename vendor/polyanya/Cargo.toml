# Vendored from https://github.com/vleue/polyanya at e317e05 (master after v0.17.1).
# Same sources as upstream minus the workspace, benches and dev-dependencies;
# local patches are marked with `QWE:` comments. See [patch.crates-io] in the
# root Cargo.toml for why this copy exists.

[package]
name = "polyanya"
version = "0.17.1"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["navmesh", "pathfinding", "navigation", "game-ai", "polyanya"]
readme = "README.md"
description = "Fast, optimal any-angle pathfinding on navigation meshes"
repository = "https://github.com/vleue/polyanya"
homepage = "https://github.com/vleue/polyanya"
documentation = "https://docs.rs/polyanya"
categories = ["game-development", "algorithms"]

[features]
default = ["async", "recast"]
stats = []
verbose = []
async = []
no-default-baking = []
detailed-layers = []
serde = ["glam/serde", "rstar/serde", "dep:serde", "rerecast?/serialize"]
recast = ["dep:rerecast"]

[dependencies]
spade = { version = "2.15.0" }
tracing = { version = "0.1", optional = true }
hashbrown = { version = "0.17" }
glam = { version = "0.32.1", features = ["approx"] }
smallvec = { version = "1.15", features = ["union", "const_generics"] }
rstar = { version = "0.13" }
serde = { version = "1.0", features = ["derive"], optional = true }
geo = "0.33.1"
log = "0.4"
thiserror = "2"
serde_json = { version = "1.0", optional = true }
rerecast = { version = "0.4.0", optional = true }

[lib]
bench = false
