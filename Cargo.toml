[package]
name = "qwe"
version = "0.1.0"
edition = "2024"
# примеры разложены по назначению (`examples/<вид>/<имя>.rs`), а cargo сам
# находит только `examples/*.rs` и `examples/*/main.rs` — поэтому автопоиск
# выключен, и каждый пример объявлен ниже явно. Имена не изменились:
# `cargo run --example determinism_replay` работает как раньше.
autoexamples = false

# demos — оконные, для человека: запустил и смотришь
[[example]]
name = "crowd_demo"
path = "examples/demos/crowd_demo/main.rs"

[[example]]
name = "tree_gallery"
path = "examples/demos/tree_gallery/main.rs"

# acceptance — headless-приёмка: печатает OK/FAILED и код возврата
[[example]]
name = "determinism_replay"
path = "examples/acceptance/determinism_replay.rs"

# bench — офлайн-замеры скорости
[[example]]
name = "pathfinding_bench"
path = "examples/bench/pathfinding_bench.rs"

[[example]]
name = "polymesh_bench"
path = "examples/bench/polymesh_bench.rs"

# audit — офлайн-разбор геометрии меша, печатает отчёт
[[example]]
name = "polymesh_corner_audit"
path = "examples/audit/polymesh_corner_audit.rs"

[[example]]
name = "polymesh_merge_audit"
path = "examples/audit/polymesh_merge_audit.rs"

[[example]]
name = "polymesh_miss_audit"
path = "examples/audit/polymesh_miss_audit.rs"

[[example]]
name = "polymesh_seam_audit"
path = "examples/audit/polymesh_seam_audit.rs"

[[example]]
name = "polymesh_budget_repro"
path = "examples/audit/polymesh_budget_repro.rs"

[[example]]
name = "polymesh_empty_layer_repro"
path = "examples/audit/polymesh_empty_layer_repro.rs"

[[example]]
name = "polymesh_start_area"
path = "examples/audit/polymesh_start_area.rs"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    # instead of default ["2d", "3d", "ui", "audio"]: no 3d stack, no audio
    "2d",
    "ui",
    "dynamic_linking",
    "bevy_dev_tools",
    "bevy_remote",
    "bevy_camera_controller",
    "pan_camera",
    "default_font",
    # выбранные в UI опции переживают перезапуск (src/prefs.rs)
    "bevy_settings",
    # первопартийные виджеты панелей (src/ui/theme.rs): кнопки, ползунки,
    # текстовое поле. Тянет только UI-стек — ни 3d, ни звука не добавляет
    "bevy_feathers",
] }
bevy_northstar = "0.7"
earcutr = "0.5"
i_overlay = "7"
# симплекс-шум под поле хвойных массивов (src/map/trees/conifer.rs)
noise = "0.9"
pathfinding = "4"
# полигональный navmesh: CDT + инфляция препятствий радиусом агента
# (navigation/polymesh/). С 0.17 живёт на glam 0.32, как и bevy 0.19, — типы
# общие, отдельный инстанс glam больше не нужен. recast (импорт из rerecast)
# не используется — выключен вместе с дефолтами
polyanya = { version = "0.17", default-features = false, features = ["async"] }
rand = { version = "0.9", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

# вендоренная копия polyanya с master после v0.17.1 (vleue/polyanya@e317e05):
# нужен опрашиваемый поиск с закрытыми слоями (`Mesh::get_path_on_layers` —
# им ходит коридорный запрос, см. navigation/polymesh/path.rs::bounded_path),
# которого в апстриме нет. Патчи помечены комментарием `QWE:` в исходниках;
# остальные наши правки (дедупликация узлов, ранний NotFound, пустой слой без
# bake) влиты в апстрим PR #150–#152 и приезжают самим master
[patch.crates-io]
polyanya = { path = "vendor/polyanya" }

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[lints.clippy]
type_complexity = "allow"
wildcard_imports = "warn"
